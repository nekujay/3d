<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Просмотр модели</title>
  <style>
    :root { --bg:#f8f9fa; --text:#212529; --accent:#0d6efd; --card:#fff; }
    @media (prefers-color-scheme:dark) { :root { --bg:#121212; --text:#e0e0e0; --accent:#4dabf7; --card:#1e1e1e; } }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; }
    
    /* Верхняя панель сайта */
    .topbar { display:flex; align-items:center; gap:1rem; padding:.85rem 1.25rem; background:var(--card); box-shadow:0 1px 4px rgba(0,0,0,.06); z-index:10; }
    .topbar h1 { font-size:1.1rem; font-weight:600; flex:1; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .topbar .actions { display:flex; gap:.5rem; }
    .btn { padding:.45rem .9rem; border-radius:8px; border:1.5px solid transparent; font-weight:600; font-size:.85rem; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:.3rem; font-family:inherit; background:var(--bg); color:var(--text); transition:opacity .15s; }
    .btn:hover { opacity:.85; }
    .btn-back { border-color:var(--accent); color:var(--accent); background:transparent; }
    .btn-save { background:var(--accent); color:#fff; }
    .btn-save.saved { background:#22c55e; }
    
    /* Контейнер для 3D-просмотрщика */
    .viewer-container { flex:1; position:relative; overflow:hidden; min-height:0; }
    .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1rem; opacity:.6; pointer-events:none; background:var(--bg); z-index:5; }
    .error { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#dc3545; text-align:center; padding:2rem; font-size:1rem; background:var(--bg); z-index:5; }
    
    @media (max-width:600px) { .topbar h1 { font-size:.95rem; } .btn { font-size:.8rem; padding:.4rem .7rem; } }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="btn btn-back">← В галерею</a>
    <h1 id="modelTitle">Загрузка...</h1>
    <div class="actions">
      <button id="saveBtn" class="btn btn-save" style="display:none;">☆ Сохранить</button>
    </div>
  </div>
  <div id="viewerContainer" class="viewer-container">
    <div id="loading" class="loading">Загрузка модели...</div>
  </div>

  <!-- 1. Подключаем библиотеку Online 3D Viewer -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/online-3d-viewer@0.14.0/build/o3dv.min.js"></script>

  <script>
    const modelId = new URLSearchParams(location.search).get('id');

    // Инициализация после загрузки страницы
    window.addEventListener('load', async () => {
      if (!modelId) {
        showError('Не указан ID модели. Вернитесь в галерею.');
        return;
      }

      let model;
      try {
        // Загружаем models.json с обходом кеша
        const res = await fetch('models.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const models = await res.json();
        model = models.find(m => m.id === modelId);
      } catch (e) {
        console.error(e);
        showError('Не удалось загрузить список моделей.');
        return;
      }

      if (!model) {
        showError('Модель не найдена.');
        return;
      }

      document.title = model.title + ' — 3D';
      document.getElementById('modelTitle').textContent = model.title;

      // Настраиваем кнопку "Сохранить" (избранное)
      setupSave(modelId);

      // Инициализируем 3D-просмотрщик
      init3DViewer(model);
    });

    // --- Функция сохранения в избранное (localStorage) ---
    function setupSave(id) {
      const btn = document.getElementById('saveBtn');
      const KEY = 'saved_3d_models';
      const update = saved => {
        btn.textContent = saved ? '★ Сохранено' : '☆ Сохранить';
        btn.classList.toggle('saved', saved);
      };
      let saved = JSON.parse(localStorage.getItem(KEY) || '[]');
      btn.style.display = 'inline-flex';
      update(saved.includes(id));
      
      btn.addEventListener('click', () => {
        saved = JSON.parse(localStorage.getItem(KEY) || '[]');
        const i = saved.indexOf(id);
        if (i > -1) saved.splice(i, 1); else saved.push(id);
        localStorage.setItem(KEY, JSON.stringify(saved));
        update(saved.includes(id));
      });
    }

    // --- Инициализация Online 3D Viewer ---
    function init3DViewer(model) {
      const parentDiv = document.getElementById('viewerContainer');
      
      // Определяем цвета в зависимости от темы
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const bgColor = isDark ? new OV.RGBAColor(18, 18, 18, 255) : new OV.RGBAColor(248, 249, 250, 255);
      const defaultColor = isDark ? new OV.RGBColor(200, 200, 200) : new OV.RGBColor(150, 150, 150);

      // Создаём экземпляр просмотрщика с нужными настройками
      const viewer = new OV.EmbeddedViewer(parentDiv, {
        backgroundColor: bgColor,
        defaultColor: defaultColor,
        // Включаем навигацию и панели (это делает интерфейс похожим на 3dviewer.net)
        // (В некоторых версиях эти параметры могут называться иначе, но базовые панели 
        // уже включены в EmbeddedViewer по умолчанию)
        onModelLoaded: () => {
          // Убираем лоадер, когда модель загружена
          const loadingEl = document.getElementById('loading');
          if (loadingEl) loadingEl.remove();
        }
      });

      // Формируем список URL для загрузки
      const urls = [model.src];
      if (model.mtl) {
        urls.push(model.mtl);
      }

      // Загружаем модель
      viewer.LoadModelFromUrlList(urls);

      // Обработка ресайза окна
      window.addEventListener('resize', () => {
        viewer.Resize();
      });
    }

    // --- Показ ошибки ---
    function showError(msg) {
      const c = document.getElementById('viewerContainer');
      if (c) c.innerHTML = `<div class="error">${msg}</div>`;
    }
  </script>
</body>
</html>
